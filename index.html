<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tic Tac Toe – Vs Bot</title>

<style>
body {
  font-family: system-ui;
  background: #0f172a;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.game-container {
  background: #020617;
  padding: 20px;
  border-radius: 16px;
  text-align: center;
}

.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin: 15px 0;
}

.cell {
  width: 90px;
  height: 90px;
  font-size: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111827;
  cursor: pointer;
  border-radius: 8px;
}

/* ✅ Banner */
#announcement {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #22c55e;
  color: #022c22;
  padding: 15px 20px;
  border-radius: 10px;
  font-weight: bold;
  display: none;
}

/* ✅ Confetti canvas */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<div id="announcement">
  Nick's last day in ABI will Be June 26. I will be joining the Supervisor Team in the Victoria Contact Center
</div>

<canvas id="confetti"></canvas>

<div class="game-container">
  <h2>Tic Tac Toe</h2>
  <div id="status">Your turn</div>
  <div class="board" id="board"></div>
  <button onclick="resetBoard()">Reset</button>
</div>

<script>
const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");
const announcement = document.getElementById("announcement");

let board = Array(9).fill(null);
let current = "X";
let gameActive = true;

const wins = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

// ✅ Build board
for (let i = 0; i < 9; i++) {
  const cell = document.createElement("div");
  cell.classList.add("cell");
  cell.dataset.i = i;
  cell.onclick = () => handleMove(i);
  boardEl.appendChild(cell);
}

function handleMove(i){
  if (!gameActive || board[i]) return;

  play(i,"X");
  if (!gameActive) return;

  setTimeout(()=>{
    let move = chooseMove();
    play(move,"O");
  },300);
}

function play(i,player){
  board[i] = player;
  boardEl.children[i].textContent = player;

  let win = checkWin();

  if (win){
    gameActive = false;

    if (player === "X"){
      // ✅ ONLY PLAYER GETS THIS
      alert("Nick's last day in ABI will Be June 26. I will be joining the Supervisor Team in the Victoria Contact Center");
      announcement.style.display = "block";
      statusEl.innerHTML = "🎉 YOU WIN!";
      startConfetti();
    } else {
      statusEl.innerHTML = "🤖 Bot wins!";
    }

    return;
  }

  if (board.every(c=>c)){
    gameActive = false;
    statusEl.innerHTML = "Draw!";
    return;
  }
}

function checkWin(){
  return wins.some(([a,b,c]) =>
    board[a] && board[a]===board[b] && board[a]===board[c]
  );
}

// ✅ Simple bot
function chooseMove(){
  let free = board.map((v,i)=>v?null:i).filter(v=>v!==null);
  return free[Math.floor(Math.random()*free.length)];
}

// ✅ Reset
function resetBoard(){
  board.fill(null);
  gameActive = true;
  statusEl.innerHTML = "Your turn";
  announcement.style.display = "none";
  stopConfetti();

  [...boardEl.children].forEach(c=>c.textContent="");
}

/* ✅ CONFETTI SYSTEM */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

let confetti = [];
let confettiActive = false;

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.onresize = resizeCanvas;
resizeCanvas();

function startConfetti(){
  confettiActive = true;
  confetti = Array.from({length:150},()=>({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height - canvas.height,
    r: Math.random()*6+2,
    d: Math.random()*5+2,
    color: `hsl(${Math.random()*360},100%,50%)`
  }));
  animateConfetti();
}

function stopConfetti(){
  confettiActive = false;
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function animateConfetti(){
  if (!confettiActive) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  confetti.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();

    p.y += p.d;
    if (p.y > canvas.height) p.y = -10;
  });

  requestAnimationFrame(animateConfetti);
}
</script>

</body>
</html>
