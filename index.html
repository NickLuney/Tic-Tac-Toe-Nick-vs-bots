<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tic Tac Toe – Vs Bot</title>

<style>
body {
  font-family: system-ui;
  background: #0f172a;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.game-container {
  background: #020617;
  padding: 20px;
  border-radius: 16px;
  text-align: center;
}

/* ✅ SCOREBOARD */
.scoreboard {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
}

.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin: 15px 0;
}

.cell {
  width: 90px;
  height: 90px;
  font-size: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111827;
  cursor: pointer;
  border-radius: 8px;
}

/* ✅ Banner (kept, but not auto-triggered) */
#announcement {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #22c55e;
  color: #022c22;
  padding: 15px 20px;
  border-radius: 10px;
  font-weight: bold;
  display: none;
}

/* ✅ Confetti canvas */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<!-- ✅ Banner kept -->
<div id="announcement">
  Nick's last day in ABI will be June 26. I will be joining the Supervisor Team in the Victoria Contact Center
</div>

<canvas id="confetti"></canvas>

<div class="game-container">
  <h2>Tic Tac Toe</h2>

  <!-- ✅ SCOREBOARD -->
  <div class="scoreboard">
    <div>You: <strong id="score-x">0</strong></div>
    <div>Bot: <strong id="score-o">0</strong></div>
    <div>Draws: <strong id="score-d">0</strong></div>
  </div>

  <div id="status">Your turn</div>

  <div class="board" id="board"></div>

  <button onclick="resetBoard()">Reset Board</button>
</div>

<script>
const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");

const scoreXEl = document.getElementById("score-x");
const scoreOEl = document.getElementById("score-o");
const scoreDEl = document.getElementById("score-d");

let board = Array(9).fill(null);
let gameActive = true;

// ✅ Score tracking
let scores = { X: 0, O: 0, D: 0 };

const wins = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

// Build board
for (let i = 0; i < 9; i++) {
  const cell = document.createElement("div");
  cell.classList.add("cell");
  cell.onclick = () => handleMove(i);
  boardEl.appendChild(cell);
}

function handleMove(i){
  if (!gameActive || board[i]) return;

  play(i,"X");
  if (!gameActive) return;

  setTimeout(() => {
    const move = chooseMove();
    play(move,"O");
  },300);
}

function play(i, player){
  board[i] = player;
  boardEl.children[i].textContent = player;

  if (checkWin()){
    gameActive = false;

    if (player === "X"){
      scores.X++;
      statusEl.innerHTML = "🎉 YOU WIN!";
      startConfetti();
    } else {
      scores.O++;
      statusEl.innerHTML = "🤖 Bot wins!";
    }

    updateScores();
    return;
  }

  if (board.every(c => c)){
    gameActive = false;
    scores.D++;
    updateScores();
    statusEl.innerHTML = "Draw!";
  }
}

function checkWin(){
  return wins.some(([a,b,c]) =>
    board[a] && board[a] === board[b] && board[a] === board[c]
  );
}

// Bot (random)
function chooseMove(){
  const free = board
    .map((v,i) => v ? null : i)
    .filter(v => v !== null);
  return free[Math.floor(Math.random() * free.length)];
}

// ✅ Update scoreboard
function updateScores(){
  scoreXEl.textContent = scores.X;
  scoreOEl.textContent = scores.O;
  scoreDEl.textContent = scores.D;
}

// ✅ Reset board (scores persist)
function resetBoard(){
  board.fill(null);
  gameActive = true;
  statusEl.innerHTML = "Your turn";
  stopConfetti();

  [...boardEl.children].forEach(c => c.textContent = "");
}

/* ✅ CONFETTI */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

let confetti = [];
let active = false;

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

function startConfetti(){
  active = true;
  confetti = Array.from({length:120}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    r: Math.random() * 6 + 2,
    d: Math.random() * 5 + 2,
    color: `hsl(${Math.random() * 360},100%,50%)`
  }));
  animate();
}

function stopConfetti(){
  active = false;
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function animate(){
  if (!active) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  confetti.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();

    p.y += p.d;
    if (p.y > canvas.height) p.y = -10;
  });

  requestAnimationFrame(animate);
}
</script>

</body>
</html>
